[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scraping-coronel"
version = "2.0.0"
description = "Sistema modular de scraping de Coronel Mayorista y sincronización automatizada con Tiendanube y enriquecimiento con IA."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "colorama>=0.4.6",
    "selenium>=4.10.0",
    "openpyxl>=3.1.2",
    "pandas>=2.0.3",
    "requests>=2.31.0",
    "inputimeout>=1.0.4",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
